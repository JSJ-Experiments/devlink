name: Build DevLink
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: devlink-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          python3 tests/adb_lifecycle.py
          python3 tests/transfer.py
          python3 tests/hotreload.py
          python3 tests/launcher.py
          python3 tests/cli.py
          python3 tests/packaging.py
          for script in module/*.sh module/scripts/*.sh build/*.sh deploy/*.sh; do sh -n "$script"; done
      - name: Build Android module and server binaries
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export VERSION="0.1.$(git rev-parse --short HEAD)"
          export VERSION_CODE="$(git show -s --format=%ct HEAD)"
          build/build.sh
          build/package-origin.sh
          cp "dist/devlink-$VERSION.zip" dist/release/devlink.zip
          cat > dist/release/update.json <<JSON
          {"version":"$VERSION","versionCode":$VERSION_CODE,"zipUrl":"https://github.com/JSJ-Experiments/devlink/releases/download/latest/devlink.zip","changelog":"https://raw.githubusercontent.com/JSJ-Experiments/devlink/main/CHANGELOG.md"}
          JSON
          (cd dist/release && sha256sum devlink.zip devlink-origin-*.tar.gz update.json > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: devlink
          path: dist/release/*
      - name: Publish moving release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/release/* --clobber
          else
            gh release create latest dist/release/* --prerelease --target "$GITHUB_SHA" --title 'DevLink builds' --notes 'DevLink builds'
          fi
          # Prune old versioned ZIPs/standalone helpers only after new assets exist.
          gh release view latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              devlink.zip|devlink-origin-linux-amd64.tar.gz|devlink-origin-linux-arm64.tar.gz|checksums.txt|update.json) ;;
              *) gh release delete-asset latest "$asset" --yes ;;
            esac
          done
          gh api --method PATCH 'repos/{owner}/{repo}/git/refs/tags/latest' -f sha="$GITHUB_SHA" -F force=true --silent
          gh release edit latest --title 'DevLink: Android module + origin tools' --notes-file deploy/release-notes.md
